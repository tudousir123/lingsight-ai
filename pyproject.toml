[dependency-groups]
dev = [
    "prek>=0.5.3,<1.0.0",
]

[tool.uv.workspace]
members = ["backend"]

[tool.typos.files]
extend-exclude = [
    "docs/scaffold/img/",
    "uv.lock",
    "bun.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "backend/app/frontend/",
    "frontend/dist/",
    "frontend/public/assets/images/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Name of the package in the PR title
    "Bump certifi ",
    # CSS Unicode range notation; bare letter sequences remain checked.
    'U\+[0-9A-Fa-f]{4,6}(?:-[0-9A-Fa-f]{4,6})?',
    # Preserve the literal truncated traceback in historical test evidence.
    'Failed: Databas\.\.\.',
    # Existing evidence quotes this exact dataset directory, not an English word.
    '/volume1/DATAS/003_HealthAD/',
]

[tool.typos.default.extend-identifiers]
alls = "alls"
# React's real media event API; keep the existing exclusions and identifiers.
onSeeked = "onSeeked"
