services:

  # Docker daemon restarts silently killed this stack once (2026-10-14):
  # every lingsight container exited 255 while other projects' restart
  # policies brought them back. unless-stopped keeps the dev stack alive.
  proxy:
    image: traefik:v3.7
    restart: unless-stopped
    ports:
      - "80:80"
      - "8090:8080"
    # Duplicate the command from compose.yml to add --api.insecure=true
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log
      # Enable debug logging for local development
      - --log.level=DEBUG
      # Enable the Dashboard and API
      - --api
      # Enable the Dashboard and API in insecure mode for local development
      - --api.insecure=true
  db:
    restart: unless-stopped
    ports:
      # 3306/3307 are taken by the local MySQL containers (incl. water_maze)
      - "3308:3306"

  adminer:
    ports:
      # Host 8080 is taken by another local project
      - "8081:8080"

  backend:
    restart: unless-stopped
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: backend/Dockerfile
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - dev
      - --host
      - "0.0.0.0"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
        - path: ./frontend
          action: rebuild
          ignore:
            - ./frontend/node_modules
            - ./frontend/dist
            - ./frontend/blob-report
            - ./frontend/test-results
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov
    environment:
      FASTAPI_ENV: "development"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      # Synthetic trial fixture for the CI/dev stack (no research database
      # there); empty on hosts that mount the real research library instead.
      TRIALS_FIXTURE_DIR: ${TRIALS_FIXTURE_DIR:-}
      # Text-to-SQL research query: pass the host .env LLM gateway + read-only
      # research DB credentials through (settings prefer env vars over the
      # unmounted ../.env). Without these POST /api/v1/research/query fails
      # with ProviderError inside the container (verified 2026-10-14).
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_PROTOCOL: ${LLM_PROTOCOL:-openai}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_THINKING: ${LLM_THINKING:-disabled}
      LLM_THINKING_BUDGET_TOKENS: ${LLM_THINKING_BUDGET_TOKENS:-8192}
      LINGSIGHT_RO_PASSWORD: ${LINGSIGHT_RO_PASSWORD:-}
      # healthad-mysql publishes 3306 on the host; reach it via the Docker
      # gateway instead of the 127.0.0.1 default (which is the container itself).
      RESEARCH_DB_HOST: ${RESEARCH_DB_HOST:-host.docker.internal}
      RESEARCH_DB_PORT: ${RESEARCH_DB_PORT:-3306}
    extra_hosts:
      # Linux: resolve host.docker.internal to the Docker bridge gateway
      - "host.docker.internal:host-gateway"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
      - mailpit
    environment:
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      - PLAYWRIGHT_BASE_URL=http://backend:8000
      - VITE_API_URL=http://backend:8000
      - MAILPIT_HOST=http://mailpit:8025
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI:-}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323
