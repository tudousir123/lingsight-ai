name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"
      # Repo-wide lint: the prek gate only checks PR-touched files, so
      # tree-wide drift (e.g. a ruff format style change) otherwise
      # accumulates invisibly while per-PR checks stay green (2026-11-10).
      - name: Lint
        run: uv run bash scripts/lint.sh
        working-directory: backend
      - name: Install media validation tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run tests
        run: bash scripts/test-local.sh
        working-directory: backend
      - name: Store coverage files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        # CI runs the structure layer only: env-gated execution tests
        # (real water_maze + real LLM) skip here, so executor/pipeline/
        # grading execution paths sit outside this denominator. The 90%
        # template baseline predates that split (first honest structure
        # measurement: 87%, be7155b push). Floor the structure layer at
        # 85 and ratchet up as structure coverage grows.
        run: uv run coverage report --fail-under=85
        working-directory: backend
